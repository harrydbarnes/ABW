[package]
name = "abw"
version = "0.1.50"
description = "ABW - a lightweight Better Wrike desktop client"
authors = ["Harry Barnes"]
edition = "2021"

[lib]
name = "abw_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = "0.38.0"
open = "5"
quick-xml = "0.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tempfile = "3.27"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
panic = "abort"
