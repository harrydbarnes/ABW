[package]
name = "abw"
version = "0.1.17"
description = "ABW - a lightweight Better Wrike desktop client"
authors = ["Harry Barnes"]
edition = "2021"

[lib]
name = "abw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = "0.38.0"
chrono = { version = "0.4", features = ["serde"] }
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tempfile = "3.27"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = "symbols"
panic = "abort"
