name: Weekly dependency health

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install frontend dependencies
        run: npm ci

      - name: Install cargo-audit
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit@0.22.2

      - name: Report available dependency updates
        run: npm run dependencies:report
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Audit npm dependencies
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=moderate

      - name: Audit Rust dependencies
        if: ${{ !cancelled() }}
        run: cargo audit --file src-tauri/Cargo.lock
