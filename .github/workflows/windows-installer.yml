name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust formatting toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          profile: minimal
          components: rustfmt

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend bundle
        run: npm run build

      - name: Check release versions
        run: npm run release:check

      - name: Check PDF and spreadsheet dependencies
        run: npm run test:smoke

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: Install cargo-audit
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-audit@0.23.0

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  nsis:
    needs: quality
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      signed: ${{ steps.metadata.outputs.signed }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          profile: minimal
          components: clippy

      - name: Cache Rust compilation
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Test native logic
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Read build metadata
        id: metadata
        shell: pwsh
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $appVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $appVersion) {
            throw "Version mismatch: package.json=$packageVersion, tauri.conf.json=$appVersion."
          }

          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $signed = if ($env:HAS_UPDATER_KEY -eq 'true') { 'true' } else { 'false' }
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $signed -ne 'true') {
            throw 'TAURI_SIGNING_PRIVATE_KEY secret is required for tagged release builds.'
          }

          "version=$appVersion" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          "signed=$signed" >> $env:GITHUB_OUTPUT

      - name: Build NSIS current-user installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Warning 'TAURI_SIGNING_PRIVATE_KEY is unavailable; building installer without updater signature.'
            $overridePath = Join-Path $env:RUNNER_TEMP 'tauri-unsigned.conf.json'
            '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path $overridePath -Encoding utf8NoBOM
            npm run tauri -- build --bundles nsis --config $overridePath -- --locked
          } else {
            npm run tauri -- build --bundles nsis -- --locked
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check installer lifecycle
        id: lifecycle
        shell: pwsh
        run: ./scripts/installer-smoke.ps1

      - name: Fetch previous tested installer
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/previous-installer.ps1

      - name: Check previous-version upgrade
        if: steps.previous.outputs.has_previous == 'true'
        shell: pwsh
        env:
          PREVIOUS_INSTALLER: ${{ steps.previous.outputs.previous_installer }}
          EXPECTED_EXECUTABLE_HASH: ${{ steps.lifecycle.outputs.executable_hash }}
        run: ./scripts/installer-smoke.ps1 -PreviousInstaller $env:PREVIOUS_INSTALLER -ExpectedExecutableHash $env:EXPECTED_EXECUTABLE_HASH

      - name: Create installer checksum and verify signature
        shell: pwsh
        env:
          EXPECT_SIGNED: ${{ steps.metadata.outputs.signed }}
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $sigPath = "$($installer.FullName).sig"
          if ($env:EXPECT_SIGNED -eq 'true' -and -not (Test-Path $sigPath)) {
            throw "Expected updater signature at $sigPath."
          }

          $digest = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$digest *$($installer.Name)`n"
          [System.IO.File]::WriteAllText(
            "$($installer.FullName).sha256",
            $checksum,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload ABW installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ABW-Windows-installer-v${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.short_sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/*-setup.exe.sha256
          if-no-files-found: error
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: nsis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.nsis.outputs.version }}
      ARTIFACT_NAME: ABW-Windows-installer-v${{ needs.nsis.outputs.version }}-${{ needs.nsis.outputs.short_sha }}
    steps:
      - name: Download tested installer
        run: gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT_NAME" --dir installer

      - name: Verify checksum, generate update manifest, and publish release
        working-directory: installer
        run: |
          set -euo pipefail
          sha256sum --check *.sha256

          installer=(*-setup.exe)
          sig_file="${installer[0]}.sig"
          if [ ! -f "$sig_file" ]; then
            echo "Missing updater signature file: $sig_file" >&2
            exit 1
          fi

          notes=$(gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq '.body' || true)
          if [ -z "$notes" ]; then
            notes="Updated ABW Windows installer."
          fi

          INSTALLER_NAME="${installer[0]}" \
          SIG_FILE="$sig_file" \
          RELEASE_NOTES="$notes" \
          node -e '
            const fs = require("node:fs");
            const signature = fs.readFileSync(process.env.SIG_FILE, "utf8").trim();
            const installer = process.env.INSTALLER_NAME;
            const repo = process.env.GH_REPO;
            const tag = process.env.RELEASE_TAG;
            const manifest = {
              version: process.env.RELEASE_VERSION,
              notes: process.env.RELEASE_NOTES,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature,
                  url: `https://github.com/${repo}/releases/download/${encodeURIComponent(tag)}/${encodeURIComponent(installer)}`,
                },
              },
            };
            fs.writeFileSync("latest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          '

          release_body="$(printf '%s\n\n---\nCurrent-user Windows installer (no administrator rights required). In-app updates are cryptographically signed via Tauri minisign; Windows SmartScreen may still prompt for unsigned executables. Verify the `.sha256` checksum before manual installation.' "$notes")"

          gh release create "$RELEASE_TAG" "${installer[0]}" "$sig_file" "${installer[0]}.sha256" latest.json \
            --verify-tag \
            --title "ABW $RELEASE_TAG" \
            --notes "$release_body"
