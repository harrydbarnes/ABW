name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Check release versions
        run: npm run release:check

      - name: Check PDF and spreadsheet dependencies
        run: npm run test:smoke

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: Install cargo-audit
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  nsis:
    needs: quality
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache Rust compilation
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Read build metadata
        id: metadata
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $appVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $appVersion) {
            throw "Version mismatch: package.json=$packageVersion, tauri.conf.json=$appVersion."
          }

          $shortSha = "${{ github.sha }}".Substring(0, 7)
          "version=$appVersion" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Build NSIS current-user installer
        run: npm run tauri -- build --bundles nsis -- --locked

      - name: Test native persistence
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Check installer lifecycle
        id: lifecycle
        shell: pwsh
        run: ./scripts/installer-smoke.ps1

      - name: Fetch previous tested installer
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/previous-installer.ps1

      - name: Check previous-version upgrade
        shell: pwsh
        env:
          PREVIOUS_INSTALLER: ${{ steps.previous.outputs.previous_installer }}
          EXPECTED_EXECUTABLE_HASH: ${{ steps.lifecycle.outputs.executable_hash }}
        run: ./scripts/installer-smoke.ps1 -PreviousInstaller $env:PREVIOUS_INSTALLER -ExpectedExecutableHash $env:EXPECTED_EXECUTABLE_HASH

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $digest = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$digest *$($installer.Name)`n"
          [System.IO.File]::WriteAllText(
            "$($installer.FullName).sha256",
            $checksum,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload ABW installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ABW-Windows-installer-v${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.short_sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: nsis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      ARTIFACT_NAME: ABW-Windows-installer-v${{ needs.nsis.outputs.version }}-${{ needs.nsis.outputs.short_sha }}
    steps:
      - name: Download tested installer
        run: gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT_NAME" --dir installer
      - name: Verify checksum and publish release
        working-directory: installer
        run: |
          sha256sum --check *.sha256
          gh release create "$RELEASE_TAG" *-setup.exe *-setup.exe.sha256 \
            --verify-tag --generate-notes --title "ABW $RELEASE_TAG" \
            --notes "Current-user Windows installer; no administrator rights required. This build is unsigned, so Windows may display an unknown-publisher warning. Verify the SHA-256 checksum before installation."
